lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .: {}

  packages/adapters/claude-code:
    dependencies:
      '@sessionport/core':
        specifier: workspace:*
        version: link:../../core

  packages/adapters/codex:
    dependencies:
      '@sessionport/core':
        specifier: workspace:*
        version: link:../../core

  packages/adapters/command-code:
    dependencies:
      '@sessionport/core':
        specifier: workspace:*
        version: link:../../core

  packages/adapters/dsh:
    dependencies:
      '@sessionport/core':
        specifier: workspace:*
        version: link:../../core

  packages/adapters/kimi-code:
    dependencies:
      '@sessionport/core':
        specifier: workspace:*
        version: link:../../core

  packages/cli:
    dependencies:
      '@sessionport/adapter-claude-code':
        specifier: workspace:*
        version: link:../adapters/claude-code
      '@sessionport/adapter-codex':
        specifier: workspace:*
        version: link:../adapters/codex
      '@sessionport/adapter-command-code':
        specifier: workspace:*
        version: link:../adapters/command-code
      '@sessionport/adapter-dsh':
        specifier: workspace:*
        version: link:../adapters/dsh
      '@sessionport/adapter-kimi-code':
        specifier: workspace:*
        version: link:../adapters/kimi-code
      '@sessionport/core':
        specifier: workspace:*
        version: link:../core

  packages/core: {}
